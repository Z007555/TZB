name: Deploy web demo
on:
  push:
    branches: [main]
    paths: [index.html, style.css, controller.js, app.js, '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test controller.test.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: |
          mkdir site
          cp index.html style.css controller.js app.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
